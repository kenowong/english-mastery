<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English-Mastery · 中小学英语学习技巧归档</title>
  <meta name="description" content="把全网各平台的小学/初中/高中英语学习技巧方法归档分类，配视频与互动练习，让孩子学英语不那么枯燥。" />
  <style>
/* english-mastery · 中小学英语学习技巧归档
 * 视觉风格对齐 math-mastery：纯前端、卡片网格、轻量动效、可离线
 * 主题：明亮、彩色、不那么枯燥（孩子向）
 */
:root {
  --primary: #2bb673;
  --junior: #2f80ed;
  --senior: #eb5757;
  --ink: #1f2733;
  --muted: #6b7785;
  --line: #e7ecf1;
  --bg: #f5f8fb;
  --card: #ffffff;
  --gold: #f2b705;
  --shadow: 0 6px 20px rgba(31, 39, 51, .08);
  --shadow-h: 0 10px 30px rgba(31, 39, 51, .14);
  --radius: 16px;
  --maxw: 1080px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--junior); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(120deg, #2bb673 0%, #2f80ed 55%, #eb5757 100%);
  color: #fff; padding: 14px 18px;
  box-shadow: var(--shadow);
}
.topbar .inner { max-width: var(--maxw); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.logo .fox { font-size: 26px; }
.tagline { font-size: 12px; opacity: .92; margin-left: 2px; }
.topbar .spacer { flex: 1; }
.streak {
  background: rgba(255,255,255,.18); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
}
.streak b { color: var(--gold); }

/* ---------- 容器 ---------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 18px; }
.hero {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px 22px; margin-bottom: 16px; border: 1px solid var(--line);
}
.hero h1 { margin: 0 0 6px; font-size: 20px; }
.hero p { margin: 0; color: var(--muted); font-size: 14px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.stat {
  background: var(--bg); border-radius: 12px; padding: 8px 14px; font-size: 13px; color: var(--muted);
  border: 1px solid var(--line);
}
.stat b { color: var(--ink); font-size: 16px; }

/* ---------- 筛选 ---------- */
.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.grade-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.grade-tab {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 14px;
  transition: all .15s; box-shadow: var(--shadow);
}
.grade-tab:hover { transform: translateY(-1px); }
.grade-tab.active { color: #fff; border-color: transparent; }
.grade-tab.active[data-grade="all"] { background: #1f2733; }
.grade-tab.active[data-grade="primary"] { background: var(--primary); }
.grade-tab.active[data-grade="junior"] { background: var(--junior); }
.grade-tab.active[data-grade="senior"] { background: var(--senior); }

.dim-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; transition: all .15s;
}
.chip:hover { color: var(--ink); }
.chip.active { background: #eef4ff; color: var(--junior); border-color: #c9ddff; font-weight: 700; }

.search {
  width: 100%; max-width: 360px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
  font-size: 14px; outline: none; background: var(--card);
}
.search:focus { border-color: var(--junior); }

/* ---------- 卡片网格 ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: all .18s; position: relative; overflow: hidden;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-h); }
.card .top { display: flex; align-items: center; gap: 10px; }
.card .icon { font-size: 30px; }
.card .badge-grade {
  margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff;
}
.card h3 { margin: 10px 0 4px; font-size: 16px; }
.card .summary { color: var(--muted); font-size: 13px; margin: 0; min-height: 38px; }
.card .meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.tag { font-size: 11px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); padding: 2px 8px; border-radius: 999px; }
.card .done-flag {
  position: absolute; top: 10px; right: 10px; font-size: 18px; opacity: 0; transition: opacity .2s;
}
.card.done .done-flag { opacity: 1; }
.card.done { border-color: #bfe9d2; }
.card .progress-mini { height: 5px; background: var(--bg); border-radius: 999px; margin-top: 12px; overflow: hidden; }
.card .progress-mini > i { display: block; height: 100%; background: var(--primary); width: 0; }

/* ---------- 详情 ---------- */
.detail { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.back {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 700;
  margin-bottom: 12px; background: none; border: none; padding: 4px 0;
}
.back:hover { color: var(--ink); }
.detail .head { display: flex; align-items: center; gap: 14px; }
.detail .head .icon { font-size: 44px; }
.detail h2 { margin: 0; font-size: 22px; }
.detail .sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.detail .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.why {
  background: #fff8e6; border: 1px solid #f3e2b3; border-radius: 12px; padding: 12px 14px; margin: 16px 0;
  font-size: 14px; color: #6b5510;
}
.why b { color: #8a6d00; }

.section-title { font-size: 15px; font-weight: 800; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--junior); }

.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li {
  position: relative; padding: 10px 12px 10px 44px; border: 1px solid var(--line); border-radius: 12px;
  margin-bottom: 8px; background: var(--bg); font-size: 14px;
}
.steps li::before {
  counter-increment: s; content: counter(s); position: absolute; left: 10px; top: 10px;
  width: 24px; height: 24px; border-radius: 50%; background: var(--junior); color: #fff; font-weight: 800;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.tips { list-style: none; padding: 0; margin: 0; }
.tips li { padding: 8px 0 8px 24px; position: relative; font-size: 14px; border-bottom: 1px dashed var(--line); }
.tips li::before { content: "💡"; position: absolute; left: 0; top: 8px; }

/* 视频 */
.video-list { display: flex; flex-direction: column; gap: 10px; }
.video-item {
  display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  background: var(--bg); transition: all .15s;
}
.video-item:hover { border-color: #c9ddff; }
.video-item .play { font-size: 26px; }
.video-item .vt { font-weight: 700; font-size: 14px; }
.video-item .vu { font-size: 12px; color: var(--muted); word-break: break-all; }
.video-embed { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; margin-top: 10px; }
.bv-box { margin-top: 10px; }

/* 练习 */
.practice {
  border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #fbfdff; margin-top: 6px;
}
.practice .p-type { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.flashcard-deck { display: flex; flex-wrap: wrap; gap: 10px; }
.flip {
  width: 120px; height: 80px; perspective: 600px; cursor: pointer; user-select: none;
}
.flip .inner { width: 100%; height: 100%; position: relative; transition: transform .4s; transform-style: preserve-3d; }
.flip.flipped .inner { transform: rotateY(180deg); }
.flip .face {
  position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-weight: 800; box-shadow: var(--shadow); border: 1px solid var(--line);
}
.flip .front { background: #fff; color: var(--junior); font-size: 18px; }
.flip .back { background: var(--primary); color: #fff; transform: rotateY(180deg); font-size: 15px; }
.flip .rate { display: flex; gap: 6px; margin-top: 6px; }
.flip .rate button {
  border: none; border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; color: #fff;
}
.flip .rate .no { background: #eb5757; }
.flip .rate .yes { background: var(--primary); }

.q { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff; }
.q .qt { font-weight: 700; margin-bottom: 10px; }
.q .opts { display: flex; flex-direction: column; gap: 8px; }
.q .opt {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; font-size: 14px; background: var(--bg);
  transition: all .12s; text-align: left;
}
.q .opt:hover { border-color: #c9ddff; }
.q .opt.right { background: #e6f7ee; border-color: #9fe0c0; color: #1c7a4d; }
.q .opt.wrong { background: #fdeaea; border-color: #f3b5b5; color: #b23b3b; }
.q .feedback { font-size: 13px; margin-top: 8px; font-weight: 700; }

.fill-q { margin-bottom: 14px; }
.fill-q .sentence { font-size: 15px; margin-bottom: 6px; }
.fill-q input {
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; width: 200px; outline: none;
}
.fill-q input:focus { border-color: var(--junior); }
.fill-q .check { margin-left: 8px; border: none; background: var(--junior); color: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.fill-q .res { margin-left: 10px; font-weight: 700; }

.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.checklist input { width: 18px; height: 18px; }

.mark-done {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff;
  border: none; border-radius: 999px; padding: 11px 22px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow);
}
.mark-done:hover { filter: brightness(1.05); }
.mark-done.done { background: #1f2733; }

.source { margin-top: 18px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

/* 进度条 */
.progress-bar { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; margin: 16px 0 0; border: 1px solid var(--line); }
.progress-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--junior)); transition: width .4s; }

/* 撒花 */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 10px; height: 14px; opacity: .9; animation: fall 1.6s linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: 0; } }

/* 空状态 */
.empty { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .card .summary { min-height: auto; }
  .topbar .tagline { display: none; }
}

/* ---------- 跟读练习（Web Speech API） ---------- */
.read-box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #f3fbf6; margin-top: 6px; }
.read-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.read-toolbar select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 13px; }
.read-slow { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.read-hint { font-size: 12px; }
.read-row { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
.read-en { font-size: 17px; font-weight: 800; color: var(--ink); }
.read-zh { font-size: 13px; color: var(--muted); margin-top: 2px; }
.read-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.read-btns button { border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 700; background: var(--bg); transition: all .12s; }
.read-btns .rb-play { background: var(--junior); color: #fff; border-color: transparent; }
.read-btns .rb-record { background: var(--primary); color: #fff; border-color: transparent; }
.read-btns button:hover:not(:disabled) { filter: brightness(1.05); }
.read-btns button:disabled { cursor: not-allowed; }
.read-fb { font-size: 13px; margin-top: 8px; min-height: 18px; }
.read-fb.ok { color: #1c7a4d; }
.read-fb.low { color: #b23b3b; }
.read-fb audio { display: block; margin-top: 6px; width: 100%; max-width: 360px; }
.read-summary { font-size: 13px; font-weight: 700; color: var(--primary); margin-top: 6px; }

/* ---------- 单词词库模块 ---------- */
.top-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.top-tab { padding: 8px 18px; border-radius: 999px; background: #eef1f5; color: #445; cursor: pointer; font-weight: 700; font-size: 14px; user-select: none; }
.top-tab:hover { background: #e3e8ef; }
.top-tab.active { background: var(--primary); color: #fff; }
.words-intro { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
.unit-card .summary { color: var(--muted); }
.words-detail { max-width: 860px; margin: 0 auto; }
.fill-list { display: flex; flex-direction: column; gap: 8px; }
.word-read { background: #f3fbf6; }
.read-list { display: flex; flex-direction: column; gap: 0; }

/* 单词单元：练习模式切换（子标签）+ 逐词紧凑布局 */
.mode-tabs { display: flex; gap: 8px; margin: 18px 0 6px; }
.mode-tab { padding: 9px 18px; border-radius: 10px; background: #eef1f5; color: #445; cursor: pointer; font-weight: 700; font-size: 14px; user-select: none; }
.mode-tab:hover { background: #e3e8ef; }
.mode-tab.active { background: var(--primary); color: #fff; }
.mode-pane { margin-top: 4px; }

.run-box { border: 1px solid var(--line); border-radius: 14px; padding: 18px; background: #fff; max-width: 560px; }
.run-head { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.run-idx { color: var(--primary); }
.run-zh { font-size: 22px; font-weight: 800; color: #1f2630; margin-bottom: 14px; }
.run-word-en { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
.run-word-zh { font-size: 14px; font-weight: 600; color: var(--muted); }
.run-input { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.run-input input { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; outline: none; }
.run-input input:focus { border-color: var(--junior); }
.run-input .check { border: none; background: var(--junior); color: #fff; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
.run-input .res { font-weight: 700; margin-left: 4px; }
.run-input .rb-play { border: none; background: var(--junior); color: #fff; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; font-size: 14px; }
.run-input .rb-record { border: none; background: var(--primary); color: #fff; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; font-size: 14px; }
.run-input button:disabled { opacity: .5; cursor: not-allowed; }
.run-nav { display: flex; gap: 10px; margin-top: 14px; }
.run-nav .ghost { border: 1px solid var(--line); background: #fff; color: #445; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; }
.run-nav .ghost:disabled { opacity: .4; cursor: not-allowed; }
.run-nav .ghost:not(:disabled):hover { background: #f3f5f8; }
.run-nav .check-all { border: none; background: var(--gold); color: #4a3a00; border-radius: 10px; padding: 9px 18px; cursor: pointer; font-weight: 800; }
.run-nav .check-all:hover { filter: brightness(1.04); }

/* 拼写自测：一组一组 */
.spell-group { display: flex; flex-direction: column; gap: 10px; }
.spell-row { display: grid; grid-template-columns: 30px 1fr auto auto 1fr; align-items: center; gap: 10px; padding: 10px 12px; background: #f7f9fb; border: 1px solid var(--line); border-radius: 10px; }
.sp-no { color: var(--muted); font-weight: 700; text-align: center; }
.sp-zh { font-size: 16px; font-weight: 700; color: #1f2630; }
.sp-in { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; min-width: 130px; }
.sp-in:focus { border-color: var(--junior); }
.sp-check { border: none; background: var(--junior); color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.sp-res { font-weight: 700; min-width: 90px; }

/* 跟读：一组一组 */
.read-group { display: flex; flex-direction: column; gap: 10px; }
.read-row-word { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; background: #f7f9fb; border: 1px solid var(--line); border-radius: 10px; }
.rw-no { color: var(--muted); font-weight: 700; text-align: center; }
.rw-text { font-size: 15px; }
.rw-en { font-weight: 800; color: #1f2630; }
.rw-zh { color: var(--muted); font-size: 13px; }
.rw-btns { display: flex; gap: 8px; }
.rw-btns .rb-play { border: none; background: var(--junior); color: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 13px; }
.rw-btns .rb-record { border: none; background: var(--primary); color: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 13px; }
.rw-btns button:disabled { opacity: .5; cursor: not-allowed; }
.read-row-word .read-fb { grid-column: 1 / -1; margin-top: 2px; }
/* ---------- 拼读拆解（6 步） ---------- */
.ph-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ph-word { font-size: 26px; font-weight: 800; color: var(--ink); }
.ph-zh { font-size: 14px; color: var(--muted); font-weight: 600; }
.ph-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.ph-badge.ok { background: #e6f7ee; color: #1c7a4d; border: 1px solid #9fe0c0; }
.ph-badge.rule { background: #fff5e0; color: #8a6d00; border: 1px solid #f3e2b3; }
.ph-stepbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
.ph-step { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #eef1f5; color: #556; cursor: pointer; user-select: none; transition: all .15s; }
.ph-step.done { background: #e6f0ff; color: #2f80ed; }
.ph-step.active { background: var(--senior); color: #fff; }
.ph-body { min-height: 120px; }
.ph-learn-word, .ph-big { font-size: 30px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
.ph-syl { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px; letter-spacing: .5px; }
.ph-syl .dot { color: var(--muted); margin: 0 2px; }
.ph-ipa { font-size: 18px; color: var(--junior); font-weight: 700; margin-bottom: 10px; font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif; }
.ph-play { border: none; background: var(--junior); color: #fff; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; font-size: 14px; margin-top: 4px; transition: filter .12s; }
.ph-play:hover { filter: brightness(1.05); }
.ph-rec { border: none; background: var(--primary); color: #fff; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; font-size: 14px; margin-top: 4px; }
.ph-rec:disabled { opacity: .5; cursor: not-allowed; }
.ph-read-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.ph-map { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }

      if (c === "c" && "eiy".indexOf(nxt) >= 0) { t.ph = "/s/"; continue; }
      if (c === "g" && "eiy".indexOf(nxt) >= 0) { t.ph = "/dʒ/"; continue; }
      if (c === "s" && i > 0 && i < tokens.length - 1 &&
          isVowelSound(tokens[i - 1].ph) && isVowelSound(tokens[i + 1].ph)) { t.ph = "/z/"; continue; }
      t.ph = CONS[c] || "";
    }

    // 词表修正（覆盖上面的默认判断）
    for (var x = 0; x < tokens.length; x++) {
      var g = tokens[x].g;
      if (g === "ea" && EA_SHORT.indexOf(w) >= 0) tokens[x].ph = "/e/";
      else if (g === "ear" && EAR_NURSE.indexOf(w) >= 0) tokens[x].ph = "/ɜː/";
      else if (g === "th") {
        if (TH_VOICED.indexOf(w) >= 0) tokens[x].ph = "/ð/";
        else if (x > 0 && x < tokens.length - 1 &&
                 isVowelSound(tokens[x - 1].ph) && isVowelSound(tokens[x + 1].ph)) tokens[x].ph = "/ð/";
      }
    }

    // 非重读词尾：-er / -or / -ar / -ur 读 /ə/（sister / doctor / dollar）
    for (var z = 0; z < tokens.length; z++) {
      if (!/^(er|or|ar|ur)$/.test(tokens[z].g)) continue;
      var last = (z === tokens.length - 1) ||
        (z === tokens.length - 2 && tokens[tokens.length - 1].ph === "");
      if (last) tokens[z].ph = "/ə/";
    }
  }

  // 音节切分：按「元音音组 + 中间辅音」的数量决定切点
  function splitSyllables(tokens, w) {
    var vs = [];
    for (var i = 0; i < tokens.length; i++) if (tokens[i].ph && isVowelSound(tokens[i].ph)) vs.push(i);
    if (vs.length < 2) return [w];
    var cuts = [];
    for (var k = 0; k < vs.length - 1; k++) {
      var between = tokens.slice(vs[k] + 1, vs[k + 1]);
      var cut;
      if (between.length === 0) cut = tokens[vs[k + 1]].st;                       // 元音相连：li|on
      else if (between.length === 1) {
        var t = between[0];
        if (/^(ck|ng|nk|tch|dge|gh)$/.test(t.g)) cut = t.en;                      // 不能起首的二合字母：归前
        else if (/^(ch|sh|th|ph|wh)$/.test(t.g)) cut = t.en;                      // 二合字母整体归前：teach|er
        else if (t.g.length === 2 && t.g.charAt(0) === t.g.charAt(1)) cut = t.st + 1; // 重叠辅音从中间切：rab|bit
        else cut = t.st;                                                          // V-CV：辅音归后
      } else cut = between[0].en;                                                 // 多辅音：切在第一个之后
      cuts.push(cut);
    }
    var out = [], prev = 0;
    for (var j = 0; j < cuts.length; j++) { out.push(w.slice(prev, cuts[j])); prev = cuts[j]; }
    out.push(w.slice(prev));
    return out.filter(function (s) { return s.length > 0; });
  }

  /* 统一出口：优先人工词表，其次规则推导 */
  window.phonicsFor = function (word) {
    var w = String(word || "").toLowerCase().trim();
    if (!w) return null;

    var cur = window.PHONICS[w];
    if (cur) {
      return {
        word: word, syl: cur.s.slice(), ipa: cur.i,
        seg: cur.g.map(function (p) { return [p[0], p[1]]; }),
        ph: cur.g.map(function (p) { return p[1]; }).filter(function (x) { return x !== ""; }),
        src: "curated"
      };
    }
    if (!/^[a-z]+$/.test(w)) return null;   // 含连字符 / 数字 / 空格等不推导
    if (String(word).length > 1 && String(word) === String(word).toUpperCase()) return null; // 全大写缩写（PE 等）不推导

    var tokens = tokenize(w);
    assignPhonemes(tokens, w);
    var syl = splitSyllables(tokens, w);
    var ph = [], seg = [];
    for (var i = 0; i < tokens.length; i++) {
      seg.push([tokens[i].g, tokens[i].ph]);
      if (tokens[i].ph !== "") ph.push(tokens[i].ph);
    }
    // 拼成整词音标：去掉每个音素自带的斜杠再合并
    var body = ph.map(function (p) { return p.replace(/\//g, ""); }).join("");
    if (syl.length > 1) body = "ˈ" + body;   // 近似：重音标首音节
    return { word: word, syl: syl, ipa: "/" + body + "/", seg: seg, ph: ph, src: "rule" };
  };
})();

</script>
  <script>
/* english-mastery · 应用主逻辑
 * 路由 / 渲染 / 状态 / 互动练习 / localStorage 进度
 * 对齐 math-mastery：纯前端、hash 路由、数据驱动、离线可用
 */
(function () {
  "use strict";

  var METHODS = window.METHODS || [];
  var DIMENSIONS = window.DIMENSIONS || [];
  var GRADES = window.GRADES || [];
  var READ = window.READ_SENTENCES || [];
  var WORDS = window.WORD_BANK || {};

  var LS_PROGRESS = "em_progress_v1";
  var LS_STREAK = "em_streak_v1";
  var LS_READ = "em_read_v1";

  var state = { grade: "all", dim: null, q: "", wordGrade: "primary" };

  /* ---------- 存储 ---------- */
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(LS_PROGRESS)) || {}; }
    catch (e) { return {}; }
  }
  function saveProgress(p) { localStorage.setItem(LS_PROGRESS, JSON.stringify(p)); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function loadStreak() {
    try { return JSON.parse(localStorage.getItem(LS_STREAK)) || {}; }
    catch (e) { return {}; }
  }
  function bumpStreak() {
    var s = loadStreak();
    var t = todayStr();
    if (s.date === t) { s.count = (s.count || 0) + 1; }
    else {
      // 连续天数：昨天则 +1，否则重置为 1
      var y = new Date(Date.now() - 86400000);
      var yt = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
      s.days = (s.date === yt) ? ((s.days || 0) + 1) : 1;
      s.count = 1; s.date = t;
    }
    localStorage.setItem(LS_STREAK, JSON.stringify(s));
    return s;
  }

  function gradeColor(g) {
    for (var i = 0; i < GRADES.length; i++) if (GRADES[i].key === g) return GRADES[i].color;
    return "#1f2733";
  }
  function gradeLabel(g) {
    for (var i = 0; i < GRADES.length; i++) if (GRADES[i].key === g) return GRADES[i].label;
    return g;
  }
  function dimLabel(k) {
    for (var i = 0; i < DIMENSIONS.length; i++) if (DIMENSIONS[i].key === k) return DIMENSIONS[i].label;
    return k;
  }

  /* ---------- 工具 ---------- */
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 顶部统计 + 打卡 ---------- */
  function renderTopbar() {
    var p = loadProgress();
    var total = METHODS.length;
    var done = 0; for (var k in p) if (p[k] && p[k].done) done++;
    var s = loadStreak();
    var streakDays = s.days || 0;
    var bar = document.getElementById("topbar");
    bar.innerHTML =
      '<div class="inner">' +
      '<div class="logo"><span class="fox">🦊</span>English-Mastery</div>' +
      '<span class="tagline">中小学英语学习技巧 · 不枯燥地学</span>' +
      '<span class="spacer"></span>' +
      '<span class="streak" title="连续学习天数">🔥 连续 <b>' + streakDays + '</b> 天</span>' +
      "</div>";
    var stats = document.getElementById("stats");
    if (stats) {
      stats.innerHTML =
        '<div class="stat">技巧总数 <b>' + total + '</b></div>' +
        '<div class="stat">已掌握 <b>' + done + '</b></div>' +
        '<div class="stat">完成率 <b>' + (total ? Math.round(done / total * 100) : 0) + '% </b></div>' +
        '<div class="stat">小学 <b>' + METHODS.filter(function (m) { return m.grade === "primary"; }).length + '</b></div>' +
        '<div class="stat">初中 <b>' + METHODS.filter(function (m) { return m.grade === "junior"; }).length + '</b></div>' +
        '<div class="stat">高中 <b>' + METHODS.filter(function (m) { return m.grade === "senior"; }).length + '</b></div>';
    }
  }

  /* ---------- 顶部「学习技巧 / 单词练习」切换 Tab（所有页面共用，保证能来回切） ---------- */
  function topTabsHtml(activeView) {
    return '<div class="top-tabs">' +
      '<span class="top-tab ' + (activeView === "words" ? "" : "active") + '" data-view="methods">📚 学习技巧</span>' +
      '<span class="top-tab ' + (activeView === "words" ? "active" : "") + '" data-view="words">🔤 单词练习</span>' +
      '</div>';
  }
  function bindTopTabs() {
    var root = document.getElementById("app");
    Array.prototype.forEach.call(root.querySelectorAll(".top-tab"), function (t) {
      t.onclick = function () {
        if (t.getAttribute("data-view") === "words") location.hash = "#/words";
        else location.hash = "#/";
      };
    });
  }

  /* ---------- 首页 ---------- */
  function renderHome() {
    var root = document.getElementById("app");
    var p = loadProgress();

    var gradeTabs = '<div class="grade-tabs">';
    gradeTabs += tabHtml("all", "全部");
    GRADES.forEach(function (g) { gradeTabs += tabHtml(g.key, g.label); });
    gradeTabs += "</div>";

    var dimChips = '<div class="dim-chips">';
    dimChips += '<span class="chip ' + (state.dim === null ? "active" : "") + '" data-dim="">全部维度</span>';
    DIMENSIONS.forEach(function (d) {
      dimChips += '<span class="chip ' + (state.dim === d.key ? "active" : "") + '" data-dim="' + d.key + '">' + d.label + "</span>";
    });
    dimChips += "</div>";

    var filters =
      '<div class="filters">' + gradeTabs + dimChips +
      '<input class="search" id="search" placeholder="🔍 搜技巧 / 方法 / 关键词…" value="' + esc(state.q) + '">' +
      "</div>";

    var list = METHODS.filter(function (m) {
      if (state.grade !== "all" && m.grade !== state.grade) return false;
      if (state.dim && m.dim !== state.dim) return false;
      if (state.q) {
        var q = state.q.toLowerCase();
        var hay = (m.title + m.summary + m.dimLabel + m.gradeLabel + (m.steps || []).join("") + (m.tips || []).join("")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    var grid = '<div class="grid">';
    if (list.length === 0) {
      grid += '<div class="empty">没有匹配的技巧，换个关键词或维度试试 🐾</div>';
    } else {
      list.forEach(function (m) {
        var isDone = p[m.id] && p[m.id].done;
        var hasPractice = m.practice ? true : false;
        grid +=
          '<div class="card ' + (isDone ? "done" : "") + '" data-id="' + m.id + '">' +
          '<span class="done-flag">✅</span>' +
          '<div class="top"><span class="icon">' + m.icon + '</span>' +
          '<span class="badge-grade" style="background:' + gradeColor(m.grade) + '">' + m.gradeLabel + "</span></div>" +
          "<h3>" + esc(m.title) + "</h3>" +
          '<p class="summary">' + esc(m.summary) + "</p>" +
          '<div class="meta"><span class="tag">📚 ' + esc(m.dimLabel) + "</span>" +
          (hasPractice ? '<span class="tag">🎮 可练习</span>' : "") + "</div>" +
          '<div class="progress-mini"><i style="width:' + (isDone ? 100 : 0) + '%"></i></div>' +
          "</div>";
      });
    }
    grid += "</div>";

    var isWords = (location.hash || "").indexOf("#/words") === 0;
    var tabsHtml =
      '<div class="top-tabs">' +
      '<span class="top-tab ' + (isWords ? "" : "active") + '" data-view="methods">📚 学习技巧</span>' +
      '<span class="top-tab ' + (isWords ? "active" : "") + '" data-view="words">🔤 单词练习</span>' +
      "</div>";
    root.innerHTML = topTabsHtml("methods") + filters + grid;

    // 事件
    Array.prototype.forEach.call(root.querySelectorAll(".grade-tab"), function (t) {
      t.onclick = function () { state.grade = t.getAttribute("data-grade"); renderHome(); window.scrollTo(0, 0); };
    });
    Array.prototype.forEach.call(root.querySelectorAll(".chip"), function (c) {
      c.onclick = function () {
        var d = c.getAttribute("data-dim");
        state.dim = d === "" ? null : d; renderHome(); window.scrollTo(0, 0);
      };
    });
    bindTopTabs();
    var search = document.getElementById("search");
    if (search) search.oninput = function () { state.q = search.value; renderHomeLight(); };

    Array.prototype.forEach.call(root.querySelectorAll(".card[data-id]"), function (c) {
      c.onclick = function () { location.hash = "#/m/" + c.getAttribute("data-id"); };
    });
  }

  function tabHtml(key, label) {
    return '<span class="grade-tab ' + (state.grade === key ? "active" : "") + '" data-grade="' + key + '">' + label + "</span>";
  }

  // 搜索时只重渲染滤网下方，避免输入框失焦
  function renderHomeLight() {
    var root = document.getElementById("app");
    var old = root.innerHTML;
    renderHome();
  }

  /* ---------- 详情 ---------- */
  function renderDetail(id) {
    var m = null;
    for (var i = 0; i < METHODS.length; i++) if (METHODS[i].id === id) m = METHODS[i];
    var root = document.getElementById("app");
    if (!m) { root.innerHTML = '<div class="empty">找不到该技巧 😢</div>'; return; }
    var p = loadProgress();
    var isDone = p[m.id] && p[m.id].done;

    var stepsHtml = (m.steps || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
    var tipsHtml = (m.tips || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");

    var videosHtml = "";
    if (m.videos && m.videos.length) {
      videosHtml = m.videos.map(function (v) {
        return '<a class="video-item" href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
          '<span class="play">▶️</span><span><span class="vt">' + esc(v.title) + '</span><br>' +
          '<span class="vu">' + esc(v.url) + "</span></span></a>";
      }).join("");
    }
    if (m.bv) {
      videosHtml += '<iframe class="video-embed" src="https://player.bilibili.com/player.html?bvid=' + esc(m.bv) +
        '&autoplay=0" allowfullscreen scrolling="no"></iframe>';
    }

    var practiceHtml = m.practice ? renderPractice(m.practice) : "";
    var readHtml = renderReadSection(m);

    root.innerHTML =
      '<div class="detail">' +
      '<button class="back" id="back">← 返回技巧列表</button>' +
      '<div class="head"><span class="icon">' + m.icon + "</span>" +
      "<div><h2>" + esc(m.title) + "</h2>" +
      '<p class="sub">' + esc(m.summary) + "</p></div></div>" +
      '<div class="meta"><span class="tag" style="background:' + gradeColor(m.grade) + ';color:#fff">🎓 ' + m.gradeLabel + "</span>" +
      '<span class="tag">📚 ' + esc(m.dimLabel) + "</span></div>" +
      '<div class="why">🐾 <b>为什么要学这个？</b> ' + esc(m.why) + "</div>" +

      '<div class="section-title"><span class="bar"></span>核心步骤</div>' +
      '<ol class="steps">' + stepsHtml + "</ol>" +

      (tipsHtml ? '<div class="section-title"><span class="bar" style="background:var(--gold)"></span>实战窍门</div><ul class="tips">' + tipsHtml + "</ul>" : "") +

      (videosHtml ? '<div class="section-title"><span class="bar" style="background:var(--senior)"></span>📺 推荐视频 / 资源</div><div class="video-list">' + videosHtml + "</div>" : "") +

      (practiceHtml ? '<div class="section-title"><span class="bar" style="background:var(--primary)"></span>🎮 互动小练习</div>' + practiceHtml : "") +

      '<button class="mark-done ' + (isDone ? "done" : "") + '" id="markDone">' +
      (isDone ? "✅ 已掌握（点击取消）" : "🏆 我学会啦，标记为已掌握") + "</button>" +

      (m.source ? '<div class="source">📎 ' + esc(m.source) + "</div>" : "") +
      "</div>";

    var back = document.getElementById("back");
    if (back) back.onclick = function () { history.back(); };

    bindPractice(m);
    bindRead(m);

    var md = document.getElementById("markDone");
    if (md) md.onclick = function () { toggleDone(m.id); };
  }

  function toggleDone(id) {
    var p = loadProgress();
    if (!p[id]) p[id] = {};
    p[id].done = !p[id].done;
    if (p[id].done) { p[id].practiced = true; bumpStreak(); if (typeof confetti === "function") confetti(); }
    saveProgress(p);
    renderTopbar();
    renderDetail(id);
  }

  /* ---------- 互动练习 ---------- */
  function renderPractice(pr) {
    if (pr.type === "flashcard") return renderFlashcard(pr);
    if (pr.type === "choice") return renderChoice(pr);
    if (pr.type === "fill") return renderFill(pr);
    if (pr.type === "checklist") return renderChecklist(pr);
    return "";
  }

  function renderFlashcard(pr) {
    var cards = pr.items.map(function (it, i) {
      return '<div class="flip" data-i="' + i + '"><div class="inner">' +
        '<div class="face front">' + esc(it.word) + '<div class="rate"><button class="no" data-r="0">不认识</button><button class="yes" data-r="1">认识</button></div></div>' +
        '<div class="face back">' + esc(it.meaning) + "</div></div></div>";
    }).join("");
    return '<div class="practice"><div class="p-type">🃏 单词闪卡：点卡片翻面，再选「认识 / 不认识」自评</div>' +
      '<div class="flashcard-deck">' + cards + "</div></div>";
  }

  function renderChoice(pr) {
    var qs = pr.items.map(function (it, i) {
      var opts = it.options.map(function (o, j) {
        return '<button class="opt" data-q="' + i + '" data-o="' + j + '" data-ans="' + esc(it.answer) + '">' + esc(o) + "</button>";
      }).join("");
      return '<div class="q" data-q="' + i + '"><div class="qt">' + (i + 1) + ". " + esc(it.q) + '</div><div class="opts">' + opts + '</div><div class="feedback"></div></div>';
    }).join("");
    return '<div class="practice"><div class="p-type">✅ 选择题：选出正确答案，立刻看反馈</div>' + qs + "</div>";
  }

  function renderFill(pr) {
    var qs = pr.items.map(function (it, i) {
      return '<div class="fill-q" data-q="' + i + '" data-ans="' + esc(it.answer) + '">' +
        '<div class="sentence">' + esc(it.sentence) + "</div>" +
        '<input placeholder="填这里"><button class="check">核对</button><span class="res"></span></div>';
    }).join("");
    return '<div class="practice"><div class="p-type">✍️ 填空：根据句意填入正确形式</div>' + qs + "</div>";
  }

  function renderChecklist(pr) {
    var items = pr.items.map(function (t) {
      return "<li><input type='checkbox'> <span>" + esc(t) + "</span></li>";
    }).join("");
    return '<div class="practice"><div class="p-type">✅ 今日打卡清单：完成一项勾一项</div><ul class="checklist">' + items + "</ul></div>";
  }

  /* ---------- 跟读练习（Web Speech API：语音合成 + 语音识别 + 录音） ---------- */
  function loadRead() {
    try { return JSON.parse(localStorage.getItem(LS_READ)) || {}; } catch (e) { return {}; }
  }
  function saveRead(o) { localStorage.setItem(LS_READ, JSON.stringify(o)); }
  function normWords(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(Boolean);
  }
  // 词级匹配相似度 0..1：识别词中命中原文词（按频次）的比例
  function speechScore(recognized, target) {
    var t = normWords(target), r = normWords(recognized);
    if (!t.length) return 0;
    var setT = {}, setR = {};
    t.forEach(function (w) { setT[w] = (setT[w] || 0) + 1; });
    r.forEach(function (w) { setR[w] = (setR[w] || 0) + 1; });
    var hit = 0;
    Object.keys(setR).forEach(function (w) { if (setT[w]) hit += Math.min(setT[w], setR[w]); });
    return hit / t.length;
  }
  var _voiceCache = null;
  function pickVoice() {
    var synth = window.speechSynthesis;
    if (!synth || !synth.getVoices) return null;
    if (_voiceCache) return _voiceCache;
    var vs = synth.getVoices() || [];
    _voiceCache = vs.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] ||
                  vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
    return _voiceCache;
  }
  function speak(text, opts) {
    opts = opts || {};
    var synth = window.speechSynthesis;
    if (!synth) { alert("当前浏览器不支持语音朗读，请换 Chrome / Edge"); return; }
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || opts.lang || "en-US";
    u.rate = opts.rate || 1;
    u.pitch = (opts.pitch != null) ? opts.pitch : 1;
    synth.speak(u);
  }
  function updateReadSummary(id, total) {
    var sum = document.getElementById("readSummary");
    if (!sum) return;
    var o = loadRead();
    var done = (o[id] || []).length;
    if (total && done >= total) sum.innerHTML = "🎉 跟读通关！" + done + "/" + total + " 句都达标啦";
    else sum.textContent = "已完成 " + done + "/" + total + " 句跟读（识别匹配度 ≥ 60% 算达标）";
  }
  function markReadDone(id, i, ok) {
    if (!ok) return;
    var o = loadRead();
    if (!o[id]) o[id] = [];
    if (o[id].indexOf(i) < 0) { o[id].push(i); saveRead(o); }
    updateReadSummary(id, (READ[id] || []).length);

  function bindRead(m) {
    var list = READ[m.id] || [];
    if (!list.length) return;
    var synth = window.speechSynthesis;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var MR = (window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    var accentSel = document.getElementById("readAccent");
    var slowChk = document.getElementById("readSlow");

    Array.prototype.forEach.call(document.querySelectorAll(".rb-play"), function (b) {
      b.onclick = function () { speak(list[+b.getAttribute("data-i")].en, { lang: accentSel ? accentSel.value : "en-US", rate: (slowChk && slowChk.checked) ? 0.7 : 1 }); };
    });

    // 录音回放（MediaRecorder）
    if (!MR) {
      Array.prototype.forEach.call(document.querySelectorAll(".rb-tape"), function (b) {
        b.disabled = true; b.style.opacity = ".5"; b.title = "当前浏览器不支持录音";
      });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll(".rb-tape"), function (b) {
        b.onclick = function () {
          var i = +b.getAttribute("data-i");
          var fb = document.querySelector('.read-fb[data-i="' + i + '"]');
          if (b.getAttribute("data-rec") === "1") {
            if (window._emRec && window._emRec.state === "recording") window._emRec.stop();
            b.setAttribute("data-rec", "0"); b.textContent = "🔴 录我的声音";
            return;
          }
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            var chunks = [];
            var mr = new MediaRecorder(stream);
            window._emRec = mr;
            mr.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
            mr.onstop = function () {
              stream.getTracks().forEach(function (t) { t.stop(); });
              var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
              var url = URL.createObjectURL(blob);
              fb.innerHTML = "";
              fb.appendChild(document.createTextNode("我的录音："));
              var au = document.createElement("audio"); au.controls = true; au.src = url;
              fb.appendChild(au); fb.className = "read-fb ok";
            };
            mr.start();
            b.setAttribute("data-rec", "1"); b.textContent = "⏹ 停止录制";
          }).catch(function (err) {
            fb.textContent = "麦克风打不开：" + err.message; fb.className = "read-fb low";
          });
        };
      });
    }

    // 语音识别打分
    if (!SR) {
      Array.prototype.forEach.call(document.querySelectorAll(".rb-record"), function (b) {
        b.disabled = true; b.style.opacity = ".5";
        b.title = "当前浏览器不支持语音识别，请用 Chrome / Edge，并在本机(localhost)或 https 下打开";
      });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll(".rb-record"), function (b) {
        b.onclick = function () {
          var i = +b.getAttribute("data-i");
          var fb = document.querySelector('.read-fb[data-i="' + i + '"]');
          var rec = new SR();
          rec.lang = accentSel ? accentSel.value : "en-US";
          rec.interimResults = false; rec.maxAlternatives = 1;
          b.textContent = "🎙 听…"; b.disabled = true;
          rec.onresult = function (e) {
            var txt = e.results[0][0].transcript;
            var sc = speechScore(txt, list[i].en);
            var stars = Math.max(1, Math.round(sc * 5));
            var starStr = ""; for (var k = 0; k < 5; k++) starStr += (k < stars ? "⭐" : "☆");
            fb.innerHTML = "你说：<b>" + esc(txt) + "</b><br>匹配度 " + Math.round(sc * 100) + "%　" + starStr;
            fb.className = "read-fb " + (sc >= 0.6 ? "ok" : "low");
            markReadDone(m.id, i, sc >= 0.6);
          };
          rec.onerror = function (e) { fb.textContent = "识别失败：" + e.error; fb.className = "read-fb low"; };
          rec.onend = function () { b.textContent = "🎤 跟我读"; b.disabled = false; };
          try { rec.start(); } catch (err) { fb.textContent = "无法启动麦克风：" + err.message; b.textContent = "🎤 跟我读"; b.disabled = false; }
        };
      });
    }
    updateReadSummary(m.id, list.length);
  }

        if (k >= seq.length) return;
        syn.cancel();
        var u = new SpeechSynthesisUtterance(seq[k]);
        var v = pickVoice(); if (v) u.voice = v;
        u.lang = (v && v.lang) || opt().lang || "en-US";
        u.rate = (opts.rate || opt().rate || 1) * 0.85;
        u.onend = function () { k++; setTimeout(next, opts.gap == null ? 220 : opts.gap); };
        syn.speak(u);
      })();
    }
    // 逐音拼读：把整词按音素序列依次读出（替代旧版「按音节字母碎片读」，后者 TTS 会把 py 读成 pee-eye）
    function speakPhonemes(info, slow) {
      var syn = window.speechSynthesis;
      if (!syn) { alert("当前浏览器不支持语音朗读，请换 Chrome / Edge"); return; }
      var toks = (info.ph || []).map(function (ph) {
        return window.PHONICS_BLEND[ph] || window.PHONICS_SPEAK[ph] || "";
      }).filter(Boolean);
      if (!toks.length) { speak(info.word || "", opt()); return; }
      var k = 0;
      (function next() {
        if (k >= toks.length) return;
        syn.cancel();
        var u = new SpeechSynthesisUtterance(toks[k]);
        var v = pickVoice(); if (v) u.voice = v;
        u.lang = (v && v.lang) || opt().lang;
        u.rate = slow ? 0.55 : 0.82;
        u.onend = function () { k++; setTimeout(next, 170); };
        syn.speak(u);
      })();
    }
    function allSplits(word) {
      var n = word.length, res = [], maxMask = (n > 12) ? 0 : (1 << (n - 1));
      if (maxMask) {
        for (var mask = 0; mask < maxMask; mask++) {
          var s = "";
          for (var i = 0; i < n; i++) { s += word[i]; if (i < n - 1 && ((mask >> i) & 1)) s += "·"; }
          res.push(s);
        }
      } else {
        for (var t = 0; t < 300; t++) {
          var m = 0; for (var b = 0; b < n - 1; b++) if (Math.random() < 0.3) m |= (1 << b);
          var ss = ""; for (var i2 = 0; i2 < n; i2++) { ss += word[i2]; if (i2 < n - 1 && ((m >> i2) & 1)) ss += "·"; }
          res.push(ss);
        }
      }
      return res;
    }
    var IPA_POOL = ["/æ/","/e/","/ɪ/","/ɒ/","/ʌ/","/ɑː/","/ɔː/","/eɪ/","/aɪ/","/aʊ/","/əʊ/","/iː/","/uː/","/ʊ/","/ɜː/","/ə/","/ʃ/","/tʃ/","/θ/","/ð/","/ŋ/","/s/","/z/"];
    function genWrongIpa(info) {
      var ph = (info.ph || []).slice();
      if (!ph.length) return info.ipa;
      var i = Math.floor(Math.random() * ph.length);
      ph[i] = IPA_POOL[Math.floor(Math.random() * IPA_POOL.length)];
      var body2 = ph.map(function (p) { return String(p).replace(/\//g, ""); }).join("");
      return "/" + body2 + "/";
    }

    function renderPhonics(start) {
      if (typeof start === "number") phIdx = start;
      if (!phRun) return;
      if (!phList.length) {
        phRun.innerHTML = '<div class="empty">本单元暂无可用于「拼读拆解」的单词（含空格、连字符或全大写缩写的词已自动跳过）。</div>';
        return;
      }
      var w = phList[phIdx];
      var info = window.phonicsFor(w.en);
      var wordTotal = phList.length;

      var stepBar = STEP_LABELS.map(function (lab, i) {
        return '<span class="ph-step ' + (i === phStep ? "active" : (i < phStep ? "done" : "")) + '" data-step="' + i + '">' + (i + 1) + ". " + lab + "</span>";
      }).join("");

      phRun.innerHTML =
        '<div class="ph-head">' +
          (phStep === 5
            ? '<div class="ph-word ph-word-quiz"><span class="ph-lock">🔒 听音拼写</span> <span class="ph-zh">(' + esc(w.zh) + ')</span></div>'
            : '<div class="ph-word">' + esc(w.en) + ' <span class="ph-zh">(' + esc(w.zh) + ')</span></div>'
          ) +
          '<div class="ph-badge ' + (info.src === "curated" ? "ok" : "rule") + '">' + (info.src === "curated" ? "✓ 已校对" : "≈ 规则推导") + '</div>' +
        '</div>' +
        '<div class="ph-stepbar">' + stepBar + '</div>' +
        '<div class="ph-body" id="phBody"></div>' +
        '<div class="run-nav">' +
          '<button class="ghost" id="phStepPrev"' + (phStep === 0 ? " disabled" : "") + '>← 上一步</button>' +
          '<button class="ghost" id="phWordPrev"' + (phIdx === 0 ? " disabled" : "") + '>← 上一个词</button>' +
          '<span class="ph-counter">第 ' + (phIdx + 1) + " / " + wordTotal + ' 词</span>' +
          '<button class="ghost" id="phWordNext"' + (phIdx >= wordTotal - 1 ? " disabled" : "") + '>下一个词 →</button>' +
          '<button class="ghost" id="phStepNext"' + (phStep >= 5 ? " disabled" : "") + '>下一步 →</button>' +
        '</div>';

      Array.prototype.forEach.call(phRun.querySelectorAll(".ph-step"), function (s) {
        s.onclick = function () { phStep = +s.getAttribute("data-step"); renderPhonics(); };
      });
      var sp = document.getElementById("phStepPrev"); if (sp && phStep > 0) sp.onclick = function () { phStep--; renderPhonics(); };
      var sn = document.getElementById("phStepNext"); if (sn && phStep < 5) sn.onclick = function () { phStep++; renderPhonics(); };
      var wp = document.getElementById("phWordPrev"); if (wp && phIdx > 0) wp.onclick = function () { phIdx--; phStep = 0; renderPhonics(); };
      var wn = document.getElementById("phWordNext"); if (wn && phIdx < wordTotal - 1) wn.onclick = function () { phIdx++; phStep = 0; renderPhonics(); };

      bindStep(phStep, info, w);
    }

    function bindStep(step, info, w) {
      var body = document.getElementById("phBody");
      if (!body) return;

      if (step === 0) {
        var mapRows = info.seg.map(function (p) {
          var ipa = p[1];
          var snd = ipa ? (window.PHONICS_BLEND[ipa] || "") : "";
          var ex = ipa ? (window.PHONICS_SPEAK[ipa] || "") : "";
          var sCls = ipa ? "" : " silent";
          return '<div class="ph-grapheme' + sCls + '" data-sound="' + esc(snd) + '" data-word="' + esc(ex) + '">' +
            '<span class="ph-g">' + esc(p[0]) + '</span>' +
            '<span class="ph-s">' + (ipa ? esc(ipa) : "∅") + '</span>' +
            (ipa
              ? '<span class="ph-a"><i class="ph-lbl">例词</i>' + esc(ex || "—") + '</span>'
              : '<span class="ph-a">不发音</span>') +
          '</div>';
        }).join("");
        body.innerHTML =
          '<div class="ph-learn-word">' + esc(w.en) + '</div>' +
          '<div class="ph-syl">' + info.syl.map(function (s) { return esc(s); }).join('<span class="dot">·</span>') + '</div>' +
          '<div class="ph-ipa">' + esc(info.ipa) + '</div>' +
          '<button class="ph-play" id="phWhole">🔊 听整词</button>' +
          '<div class="section-title"><span class="bar"></span>字母组合 → 发音（点格子：先听该音，再听例词）</div>' +
          '<div class="ph-map" id="phMap">' + mapRows + '</div>' +
          '<div class="ph-note">点格子会先读该音的近似读法（如 f → 「fuh」），再读一个例词帮记忆；整词的标准发音请点「听整词」。灰色「∅ / 不发音」表示该字母组合不发音（如 write 的 w、have 的 e）。规则推导词仅供参考，音标以词典 / 教材为准。</div>';
        var whole = document.getElementById("phWhole"); if (whole) whole.onclick = function () { speak(w.en, opt()); };
        Array.prototype.forEach.call(body.querySelectorAll(".ph-grapheme"), function (t) {
          t.onclick = function () {
            var snd = t.getAttribute("data-sound");
            var ex = t.getAttribute("data-word");
            var seq = (snd && ex && snd !== ex) ? [snd, ex] : [ex || snd];
            if (!seq[0]) return;
            playSeq(seq, { gap: 280 });
          };
        });

      } else if (step === 1) {
        body.innerHTML =
          '<div class="ph-big">' + esc(w.en) + '</div>' +
          '<div class="ph-syl">' + info.syl.map(function (s) { return esc(s); }).join('<span class="dot">·</span>') + '</div>' +
          '<div class="ph-read-btns">' +
            '<button class="ph-play" id="phWhole2">🔊 听示范</button>' +
            '<button class="ph-play" id="phSyl">🔊 音素拼读</button>' +
            '<button class="ph-rec" id="phRec">🎤 跟我读</button>' +
          '</div>' +
          '<div class="read-fb" id="phReadFb"></div>' +
          '<div class="ph-note">「跟我读」需要麦克风权限，且仅在 localhost 或 https 下、用 Chrome / Edge 可用。</div>';
        var whole2 = document.getElementById("phWhole2"); if (whole2) whole2.onclick = function () { speak(w.en, opt()); };
        var sylB = document.getElementById("phSyl"); if (sylB) sylB.onclick = function () { speakPhonemes(info, false); };
        var rec2 = document.getElementById("phRec");
        var fb2 = document.getElementById("phReadFb");
        if (!SR) { if (rec2) { rec2.disabled = true; rec2.style.opacity = ".5"; rec2.title = "当前浏览器不支持语音识别，请用 Chrome / Edge，并在本机(localhost)或 https 下打开"; } }
        else if (rec2) {
          rec2.onclick = function () {
            var rec = new SR();
            rec.lang = accentSel ? accentSel.value : "en-US";
            rec.interimResults = false; rec.maxAlternatives = 1;
            rec2.textContent = "🎙 听…"; rec2.disabled = true;
            rec.onresult = function (e) {
              var txt = e.results[0][0].transcript;
              var sc = speechScore(txt, w.en);
              var stars = Math.max(1, Math.round(sc * 5));
              var starStr = ""; for (var kk = 0; kk < 5; kk++) starStr += (kk < stars ? "⭐" : "☆");
              fb2.innerHTML = "你说：<b>" + esc(txt) + "</b><br>匹配度 " + Math.round(sc * 100) + "%　" + starStr;
              fb2.className = "read-fb " + (sc >= 0.6 ? "ok" : "low");
            };
            rec.onerror = function (e) { fb2.textContent = "识别失败：" + e.error; fb2.className = "read-fb low"; };
            rec.onend = function () { rec2.textContent = "🎤 跟我读"; rec2.disabled = false; };
            try { rec.start(); } catch (err) { fb2.textContent = "无法启动麦克风：" + err.message; rec2.textContent = "🎤 跟我读"; rec2.disabled = false; }
          };
        }

      } else if (step === 2) {
        var choices, correctStr, qtext;
        if (info.syl.length > 1) {
          correctStr = info.syl.join("·");
          qtext = "这个词怎么分音节？选出正确的一项";
          var pool = allSplits(w.en).filter(function (s) { return s !== correctStr; });
          shuffle(pool);
          choices = [correctStr];
          if (pool[0]) choices.push(pool[0]);
          if (pool[1]) choices.push(pool[1]);
          while (choices.length < 3) { var alt = correctStr.split("").reverse().join(""); if (choices.indexOf(alt) < 0) choices.push(alt); else break; }
        } else {
          correctStr = info.ipa;
          qtext = "这个单词的正确音标是？选出正确的一项";
          var wp2 = [genWrongIpa(info), genWrongIpa(info)];
          choices = [correctStr];
          if (wp2[0]) choices.push(wp2[0]);
          if (wp2[1] && wp2[1] !== correctStr) choices.push(wp2[1]);
          if (choices.length < 3 && wp2[1]) choices.push(wp2[1]);
        }
        shuffle(choices);
        body.innerHTML =
          '<div class="ph-big">' + esc(w.en) + '</div>' +
          '<div class="ph-q">' + qtext + '</div>' +
          '<div class="ph-choices" id="phChoices" data-ans="' + esc(correctStr) + '">' +
            choices.map(function (c) { return '<button class="ph-choice" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join("") +
          '</div>' +
          '<div class="read-fb" id="phSelFb"></div>';
        Array.prototype.forEach.call(body.querySelectorAll(".ph-choice"), function (b) {
          b.onclick = function () {
            var ans = body.querySelector("#phChoices").getAttribute("data-ans");
            var pick = b.getAttribute("data-c");
            if (pick === ans) {
              b.classList.add("right");
              var f = document.getElementById("phSelFb");
              f.textContent = "✅ 正确！" + (info.syl.length > 1 ? ("音节切分：" + info.syl.join("·")) : ("音标：" + info.ipa));
              f.className = "read-fb ok";
            } else {
              b.classList.add("wrong");
              var f2 = document.getElementById("phSelFb");
              f2.textContent = "💡 正确答案：" + ans;
              f2.className = "read-fb low";
            }
            Array.prototype.forEach.call(body.querySelectorAll(".ph-choice"), function (x) { x.disabled = true; });
          };
        });

      } else if (step === 3) {
        var sylCuts = []; var cum = 0;
        for (var si = 0; si < info.syl.length - 1; si++) { cum += info.syl[si].length; sylCuts.push(cum); }
        var gStart = 0; var correctBreaks = {};
        for (var gi = 0; gi < info.seg.length; gi++) {
          var glen = info.seg[gi][0].length;
          var gEnd = gStart + glen;
          if (gi < info.seg.length - 1 && sylCuts.indexOf(gEnd) >= 0) correctBreaks[gi] = true;
          gStart = gEnd;
        }
        var q3 = "点击字母之间的「·」标出音节断点，再点「核对」。" + (info.syl.length === 1 ? "（这个单词只有一个音节，不用点断点）" : "");
        var tiles = "";
        for (var t = 0; t < info.seg.length; t++) {
          tiles += '<span class="ph-tile" data-gi="' + t + '">' + esc(info.seg[t][0]) + '</span>';
          if (t < info.seg.length - 1) tiles += '<span class="ph-gap" data-gap="' + t + '">·</span>';
        }
        body.innerHTML =
          '<div class="ph-big">' + esc(w.en) + '</div>' +
          '<div class="ph-q">' + q3 + '</div>' +
          '<div class="ph-split" id="phSplit">' + tiles + '</div>' +
          '<div class="ph-split-preview" id="phSplitPrev"></div>' +
          '<div class="ph-read-btns">' +
            '<button class="check-all" id="phSplitCheck">核对</button>' +
            '<button class="ghost" id="phSplitAns">显示答案</button>' +
          '</div>' +
          '<div class="read-fb" id="phSplitFb"></div>';
        var active = {};
        function buildSplit() {
          var parts = []; var cur = "";
          for (var t2 = 0; t2 < info.seg.length; t2++) { cur += info.seg[t2][0]; if (active[t2]) { parts.push(cur); cur = ""; } }
          parts.push(cur);
          return parts;
        }
        Array.prototype.forEach.call(body.querySelectorAll(".ph-gap"), function (g) {
          g.onclick = function () {
            var idx = +g.getAttribute("data-gap");
            if (active[idx]) { delete active[idx]; g.classList.remove("on"); } else { active[idx] = true; g.classList.add("on"); }
            var pv = document.getElementById("phSplitPrev");
            if (pv) pv.textContent = "你的切分：" + buildSplit().join(" · ");
          };
        });
        var checkB = document.getElementById("phSplitCheck");
        if (checkB) checkB.onclick = function () {
          var fb = document.getElementById("phSplitFb");
          if (buildSplit().join("·") === info.syl.join("·")) { fb.textContent = "✅ 切分正确：" + info.syl.join("·"); fb.className = "read-fb ok"; }
          else { fb.textContent = "💡 还不对，正确切分是：" + info.syl.join(" · "); fb.className = "read-fb low"; }
        };
        var ansB = document.getElementById("phSplitAns");
        if (ansB) ansB.onclick = function () {
          var fb = document.getElementById("phSplitFb");
          fb.textContent = "正确切分：" + info.syl.join(" · ");
          fb.className = "read-fb ok";
        };

      } else if (step === 4) {
        body.innerHTML =
          '<div class="ph-big">' + esc(w.en) + '</div>' +
          '<div class="ph-syl-blocks" id="phSylBlocks">' +
            info.syl.map(function (s, i) { return '<span class="ph-syl-block" data-i="' + i + '">' + esc(s) + '</span>'; }).join('<span class="ph-arrow">→</span>') +
          '</div>' +
          '<div class="ph-read-btns">' +
            '<button class="ph-play" id="phBlendEach">🔊 音素慢读</button>' +
            '<button class="ph-play" id="phBlendAll">🔊 连起来拼读</button>' +
          '</div>' +
          '<div class="ph-note">先逐音拼读，再跟着连起来读（听整词）。会了就点「✅ 我会拼读了」。</div>' +
          '<button class="check-all" id="phBlendOk">✅ 我会拼读了</button>';
        var eachB = document.getElementById("phBlendEach"); if (eachB) eachB.onclick = function () { speakPhonemes(info, true); };
        var allB = document.getElementById("phBlendAll"); if (allB) allB.onclick = function () { speak(w.en, opt()); };
        var okB = document.getElementById("phBlendOk"); if (okB) okB.onclick = function () { okB.textContent = "🎉 太棒了！"; okB.classList.add("done"); };

      } else if (step === 5) {
        body.innerHTML =
          '<div class="ph-q">听发音，写出这个单词的拼写：<span class="ph-zh">（' + esc(w.zh) + '）</span></div>' +
          '<div class="ph-spell-row">' +
            '<button class="ph-play" id="phSpellPlay">🔊 听</button>' +
            '<input class="ph-spell-in" id="phSpellIn" placeholder="拼写出英文" autocomplete="off" />' +
            '<button class="check" id="phSpellCheck">核对</button>' +
            '<span class="res" id="phSpellRes"></span>' +
          '</div>' +
          '<div class="ph-note">听录音写单词（本题不显示单词，只给词义）；卡住了可点「音节提示」。' +
            '<button class="ghost ph-hint-btn" id="phSpellHint">🔍 音节提示（共 ' + info.syl.length + ' 个音节）</button>' +
            '<span class="ph-hint-txt" id="phSpellHintTxt"></span>' +
          '</div>';
        var playB = document.getElementById("phSpellPlay"); if (playB) playB.onclick = function () { speak(w.en, opt()); };
        var hintB = document.getElementById("phSpellHint");
        var hintTxt = document.getElementById("phSpellHintTxt");
        if (hintB) hintB.onclick = function () {
          if (hintTxt) hintTxt.textContent = " 音节 = " + info.syl.join(" · ") + (info.src === "rule" ? "（音标为规则推导，仅供参考）" : "");
          hintB.style.display = "none";
        };
        var inp = document.getElementById("phSpellIn");
        var resEl = document.getElementById("phSpellRes");
        function doCheck() {
          if (!inp || !resEl) return;
          var ans = w.en.trim().toLowerCase();
          var val = inp.value.trim().toLowerCase();
          if (val === ans) { resEl.textContent = "✅ 正确"; resEl.style.color = "#1c7a4d"; }
          else { resEl.textContent = "✏️ 应为 " + w.en; resEl.style.color = "#b23b3b"; }
        }
        if (inp) { inp.onkeydown = function (e) { if (e.key === "Enter") doCheck(); }; inp.focus(); }
        var chk = document.getElementById("phSpellCheck"); if (chk) chk.onclick = doCheck;
      }
    }

  }

  /* ---------- 路由 ---------- */
  function route() {
    var h = location.hash || "#/";
    if (h.indexOf("#/m/") === 0) {
      renderDetail(h.slice(4));
    } else if (h.indexOf("#/words") === 0) {
      renderWords(h);
    } else {
      renderHome();
    }
    renderTopbar();
  }
  function renderWords(hashStr) {
    var h = hashStr || "#/words";
    var parts = h.replace(/^#\/words\/?/, "").split("/").filter(Boolean);
    var grade = parts[0] || state.wordGrade || "primary";
    state.wordGrade = grade;
    if (parts[1]) renderWordUnit(grade, parts[1]);
    else renderWordsHome(grade);
  }

  window.addEventListener("hashchange", route);
  document.addEventListener("DOMContentLoaded", function () {
    // 预热语音列表，确保首次朗读就能选到英文嗓音
    try { if (window.speechSynthesis) { speechSynthesis.getVoices(); pickVoice(); } } catch (e) {}
    // 注入顶栏与统计容器
    var top = el('<div class="topbar" id="topbar"></div>');
    document.body.insertBefore(top, document.body.firstChild);
    var wrap = el('<div class="wrap"><div class="hero"><h1>🦊 中小学英语学习技巧归档</h1>' +
      '<p>把全网各平台的学习方法技巧，按 小学 / 初中 / 高中 + 能力维度 归档分类，配视频、配互动练习，让孩子学英语不那么枯燥。</p>' +
      '<div class="stat-row" id="stats"></div></div><div id="app"></div>' +
      '<div class="foot">English-Mastery · 数据驱动 · 纯前端离线可用 · 参考 math-mastery 架构 · MIT</div></div>');
    document.body.appendChild(wrap);
    route();
  });
})();

</script>
</body>
